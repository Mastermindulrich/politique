name: Preview thumbs (temporary)
# Temporary: downloads a few Commons thumbnails so screenshots can be taken offline. Removed before merge.
on:
  push:
    paths: [.preview/thumbs.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .preview/thumbs
          while read -r u; do [ -z "$u" ] && continue; f=$(echo -n "$u" | sha1sum | cut -c1-16).jpg; curl -sSfL -A "POLITIQUE-preview/1.0" -o ".preview/thumbs/$f" "$u" || echo "fail $u"; sleep 0.3; done < .preview/thumbs.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .preview/thumbs && git commit -qm "Preview thumbs (temporary)" && git pull --rebase -q && git push
