name: Library sources
# Fetches the official texts used for the library editions and commits their extracted
# text to data/library/sources/ on the same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/library/sources.tsv
      - scripts/library/index-pages.txt
      - scripts/library/fetch-sources.sh
      - .github/workflows/library-sources.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: bash scripts/library/fetch-sources.sh
      - name: Commit extracted texts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library/sources
          git diff --cached --quiet || git commit -m "Library sources: official texts extracted"
          git push
